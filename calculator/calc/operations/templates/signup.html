{% extends 'base.html' %}

{% block main_block %}

<div class="container">
    <div class="row mt-5">
        <div class="col-3"></div>
        <div class="col-6 border border-5 p-5 shadow">
            <form action="" method="post">
                <h1 class="text-center">
                    Signup Form
                </h1>
                {% csrf_token %}
                {{ form }}
                <button type="submit">Signup</button>
            </form>
        </div>
        <div class="col-3"></div>
    </div>
</div>

{% endblock %}
